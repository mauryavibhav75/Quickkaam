<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickKaam | Account Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff9933;
            --primary-dark: #ff7700;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-hover: rgba(255, 255, 255, 0.2);
            --glass-active: rgba(255, 153, 51, 0.4);
            --blur: blur(15px);
            --dark: #1a1a1a;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
        }

        body {
            min-height: 100vh; 
            width: 100%; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                        url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
            background-size: cover; 
            background-position: center;
            background-attachment: fixed;
            color: var(--white); 
            overflow-x: hidden;
            padding: 20px;
        }

        /* Back Button */
        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            background: var(--glass);
            backdrop-filter: var(--blur);
            -webkit-backdrop-filter: var(--blur);
            border: 2px solid rgba(255, 153, 51, 0.3);
            color: var(--white);
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            z-index: 1000;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .back-button:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateX(-5px);
            box-shadow: 0 12px 35px rgba(255, 153, 51, 0.5);
            border-color: var(--primary);
        }

        .back-icon {
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }

        .back-button:hover .back-icon {
            transform: translateX(-4px);
        }

        /* Main Container */
        .container { 
            text-align: center; 
            width: 90%; 
            max-width: 900px; 
            animation: zoomIn 0.8s ease-out;
            margin-top: 60px;
        }

        .project-title { 
            font-size: 4rem; 
            font-weight: 800; 
            letter-spacing: 8px; 
            margin-bottom: 15px; 
            text-transform: uppercase;
            text-shadow: 3px 5px 15px rgba(0,0,0,0.7);
            line-height: 1.2;
        }

        .project-title span { 
            color: var(--primary); 
        }

        .subtitle { 
            font-weight: 300; 
            font-size: 1.2rem;
            margin-bottom: 60px; 
            opacity: 0.9; 
            letter-spacing: 2px;
        }

        /* Options Container */
        .options-container { 
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 40px;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Role Cards */
        .role-card {
            background: var(--glass); 
            backdrop-filter: var(--blur); 
            -webkit-backdrop-filter: var(--blur);
            border: 2px solid rgba(255, 255, 255, 0.2); 
            padding: 60px 40px; 
            border-radius: 30px;
            cursor: pointer; 
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; 
            animation: fadeInUp 0.8s forwards; 
            position: relative;
            text-decoration: none;
            color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 280px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            overflow: hidden;
        }

        .role-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.6s;
        }

        .role-card:hover::before {
            left: 100%;
        }

        #userCard { 
            animation-delay: 0.3s; 
        }

        #workerCard { 
            animation-delay: 0.5s; 
        }

        .role-card:hover {
            transform: translateY(-15px) scale(1.05); 
            border-color: var(--primary);
            background: var(--primary);
            box-shadow: 0 20px 50px rgba(255, 153, 51, 0.5);
            color: var(--dark);
        }

        .role-card:active {
            transform: translateY(-10px) scale(1.02);
        }

        .role-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .role-card:hover .role-icon {
            transform: scale(1.15);
            opacity: 1;
        }

        .role-card h3 { 
            font-size: 2rem; 
            font-weight: 700; 
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .role-card p {
            font-size: 0.95rem; 
            opacity: 0.85; 
            line-height: 1.6;
            transition: all 0.3s ease;
        }

        .role-card:hover h3,
        .role-card:hover p {
            color: var(--dark);
        }

        .role-card:hover .role-icon {
            filter: brightness(0) saturate(100%);
        }

        /* Instruction Text */
        .instruction-text {
            margin-top: 50px;
            font-size: 0.9rem;
            opacity: 0.7;
            font-style: italic;
            animation: fadeIn 1s ease-in;
            animation-delay: 0.8s;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        /* Keyframes */
        @keyframes fadeInUp { 
            from { 
                opacity: 0; 
                transform: translateY(40px); 
            } 
            to { 
                opacity: 1; 
                transform: translateY(0); 
            } 
        }

        @keyframes zoomIn { 
            from { 
                opacity: 0; 
                transform: scale(0.9); 
            } 
            to { 
                opacity: 1; 
                transform: scale(1); 
            } 
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 0.7;
            }
        }

        /* Tablet Responsive */
        @media (max-width: 1024px) {
            .project-title {
                font-size: 3.5rem;
                letter-spacing: 6px;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .role-card {
                padding: 50px 35px;
                min-height: 260px;
            }

            .role-icon {
                font-size: 3.5rem;
            }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .back-button {
                top: 20px;
                left: 20px;
                padding: 10px 20px;
                font-size: 0.85rem;
            }

            .container {
                margin-top: 40px;
                width: 95%;
            }

            .project-title {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }

            .subtitle {
                font-size: 1rem;
                margin-bottom: 40px;
            }

            .options-container { 
                grid-template-columns: 1fr;
                gap: 25px;
                padding: 10px;
            }

            .role-card {
                padding: 45px 30px;
                min-height: 240px;
            }

            .role-icon {
                font-size: 3rem;
            }

            .role-card h3 {
                font-size: 1.8rem;
            }

            .role-card p {
                font-size: 0.9rem;
            }

            .instruction-text {
                font-size: 0.85rem;
                margin-top: 35px;
                padding: 0 10px;
            }
        }

        /* Small Mobile */
        @media (max-width: 480px) {
            .back-button {
                padding: 8px 16px;
                font-size: 0.8rem;
            }

            .back-icon {
                font-size: 1.1rem;
            }

            .project-title {
                font-size: 2rem;
                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 0.9rem;
                letter-spacing: 1px;
            }

            .role-card {
                padding: 35px 25px;
                min-height: 220px;
            }

            .role-icon {
                font-size: 2.5rem;
                margin-bottom: 15px;
            }

            .role-card h3 {
                font-size: 1.6rem;
                margin-bottom: 10px;
            }

            .role-card p {
                font-size: 0.85rem;
            }
        }

        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Selection Color */
        ::selection {
            background: var(--primary);
            color: var(--white);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

    <!-- Back Button -->
    <a href="home.html" class="back-button">
        <span class="back-icon">←</span>
        Back
    </a>

    <div class="container">
        <h1 class="project-title">Quick<span>Kaam</span></h1>
        <p class="subtitle" data-lang-key="create-title">Select your account type to continue</p>

        <div class="options-container">
            <a href="user.html" class="role-card" id="userCard">
                <div class="role-icon">👤</div>
                <h3 data-lang-key="create-user-title">User</h3>
                <p data-lang-key="create-user-desc">Find skilled workers & services in your area quickly and easily</p>
            </a>

            <a href="worker.html" class="role-card" id="workerCard">
                <div class="role-icon">🔧</div>
                <h3 data-lang-key="create-worker-title">Worker</h3>
                <p data-lang-key="create-worker-desc">Register your skills and connect with users seeking your expertise</p>
            </a>
        </div>

        <p class="instruction-text" data-lang-key="create-instruction">Click on your role to proceed with registration</p>
    </div>

    <script>
        // Add parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.body.style.backgroundPosition = `calc(50% + ${moveX}px) calc(50% + ${moveY}px)`;
        });

        // Add click sound effect (optional - you can remove if not needed)
        const cards = document.querySelectorAll('.role-card');
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                // Visual feedback
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 100);
            });
        });

        // Smooth scroll to top on page load
        window.addEventListener('load', () => {
            window.scrollTo(0, 0);
        });
    </script>
    <script src="translations.js"></script>
</body>
</html>
