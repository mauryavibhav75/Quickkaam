<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill India | Help & Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff9933; --glass: rgba(255, 255, 255, 0.1); --white: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(rgba(40, 39, 39, 0.85), rgba(0,0,0,0.85)), 
                        url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; color: white; padding: 20px;
        }

        .support-card { 
            background: var(--glass); backdrop-filter: blur(25px); padding: 40px; 
            border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.1); 
            width: 100%; max-width: 600px; animation: slideUp 0.6s ease-out forwards;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        h2 { color: var(--accent); margin-bottom: 10px; font-weight: 600; }
        p { opacity: 0.8; font-size: 0.9rem; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.8rem; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

        select, textarea, input { 
            width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255,255,255,0.2); 
            padding: 12px; border-radius: 10px; color: white; outline: none; transition: 0.3s; 
            font-size: 0.95rem;
        }
        
        select option { background: #222; color: white; }
        select:focus, textarea:focus, input:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); }

        .submit-btn { 
            background: var(--accent); color: black; font-weight: 600; padding: 15px; 
            border: none; border-radius: 10px; width: 100%; cursor: pointer; 
            font-size: 1rem; transition: 0.3s; margin-top: 10px;
        }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(255,153,51,0.4); }

        .back-link { 
            display: inline-block; margin-top: 20px; color: white; text-decoration: none; 
            font-size: 0.85rem; opacity: 0.6; transition: 0.3s; 
        }
        .back-link:hover { opacity: 1; color: var(--accent); }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="support-card">
        <h2 data-lang-key="help-title">Help & Support</h2>
        <p data-lang-key="help-subtitle">Facing an issue? Describe it below and our team will get back to you at <b>Mauryavibhav75@gmail.com</b>.</p>

        <form id="supportForm">
            <div class="form-group">
                <label data-lang-key="help-category">Category of Issue</label>
                <select id="issueCategory" required>
                    <option value="">-- Select an Option --</option>
                    <option value="Profile Update Issue" data-lang-key="help-opt-profile">Profile Update Issue</option>
                    <option value="Worker Not Responding" data-lang-key="help-opt-worker">Worker Not Responding</option>
                    <option value="Booking/History Error" data-lang-key="help-opt-booking">Booking/History Error</option>
                    <option value="Technical Bug" data-lang-key="help-opt-bug">Technical Bug/App Crash</option>
                    <option value="Verification Query" data-lang-key="help-opt-verification">Skill India Verification</option>
                    <option value="Other" data-lang-key="help-opt-other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label data-lang-key="help-name">Your Name</label>
                <input type="text" id="userName" data-lang-ph="ph-name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label data-lang-key="help-description">Detailed Description</label>
                <textarea id="issueDetail" rows="5" placeholder="Please explain your problem in detail..." required></textarea>
            </div>

            <button type="submit" class="submit-btn" data-lang-key="help-btn-send">Send to Support</button>
        </form>

        <a href="userDashboard.html" class="back-link" data-lang-key="help-back">← Back to Dashboard</a>
    </div>

    <script>
        document.getElementById('supportForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const category = document.getElementById('issueCategory').value;
            const name = document.getElementById('userName').value;
            const details = document.getElementById('issueDetail').value;
            const adminEmail = "Mauryavibhav75@gmail.com";

            // Constructing the Email Body
            const subject = encodeURIComponent(`Skill India Support: ${category}`);
            const body = encodeURIComponent(
                `Support Ticket Details:\n` +
                `--------------------------\n` +
                `User Name: ${name}\n` +
                `Category: ${category}\n\n` +
                `Description:\n${details}\n\n` +
                `--------------------------\n` +
                `Sent via Skill India Dashboard`
            );

            // This triggers the user's default email client
            const mailtoLink = `mailto:${adminEmail}?subject=${subject}&body=${body}`;
            
            // Redirect to mailto link
            window.location.href = mailtoLink;

            alert("Your email client will now open. Please click 'Send' to submit your problem to our team.");
        });
    </script>
    <script src="translations.js"></script>
</body>
</html>
